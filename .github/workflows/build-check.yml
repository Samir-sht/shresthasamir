name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GitHub Pages serves the committed build output from the repository root
# (Settings -> Pages -> Deploy from a branch -> main / root), so this
# workflow only verifies that the project still builds. It does not deploy.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fail if the committed build output is stale
        run: |
          if [ -n "$(git status --porcelain index.html assets)" ]; then
            echo "The committed build output differs from a fresh build."
            echo "Run 'npm run build' and commit the result."
            git --no-pager diff --stat index.html assets
            exit 1
          fi
